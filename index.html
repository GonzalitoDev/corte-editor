<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Taller Multiverse: un multiverso de apps y juegos gratis en el navegador. Explorá dimensiones, subí de nivel, desbloqueá logros y misiones. Sin cuenta, sin marca de agua.">
<meta name="theme-color" content="#05060e">
<title>Taller Multiverse</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2322d3ee'/%3E%3Cstop offset='.5' stop-color='%238b5cf6'/%3E%3Cstop offset='1' stop-color='%232f6bff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='%23070a1a'/%3E%3Ccircle cx='16' cy='16' r='7' fill='url(%23g)'/%3E%3Cellipse cx='16' cy='16' rx='13' ry='5' fill='none' stroke='url(%23g)' stroke-width='1.6' transform='rotate(-25 16 16)'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Exo+2:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="multiverse/multiverse.css">
</head>
<body>
<canvas id="cielo"></canvas>
<div class="nebulas"><span class="neb a"></span><span class="neb b"></span><span class="neb c"></span></div>
<div class="grid-floor"></div>

<header class="nav">
  <div class="wrap">
    <a class="logo" href="#top"><span class="orb"></span><b>TALLER</b><small>MULTIVERSE</small></a>
    <div class="buscar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input id="buscar" type="search" placeholder="Buscar una dimensión…" aria-label="Buscar">
    </div>
    <nav class="navbtns">
      <button class="nbtn" id="navMisiones" title="Misiones" aria-label="Misiones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="4"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></button>
      <button class="nbtn" id="navLogros" title="Logros" aria-label="Logros"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 4h8v4a4 4 0 0 1-8 0zM6 5H4v2a3 3 0 0 0 3 3M18 5h2v2a3 3 0 0 1-3 3M9 19h6M10 15h4l-.5 4h-3z"/></svg></button>
      <button class="nbtn" id="navNotis" title="Notificaciones" aria-label="Notificaciones"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 20a3 3 0 0 0 6 0"/></svg><span class="pip" id="pipNotis" hidden>0</span></button>
      <button class="nbtn perfil" id="navPerfil" title="Perfil" aria-label="Perfil"><span class="av">🧑‍🚀</span><span class="lvl">Nv 1</span></button>
    </nav>
  </div>
</header>

<main class="wrap" id="top">
  <section class="hero">
    <h1>TALLER MULTIVERSE</h1>
    <p class="sub">Un multiverso de herramientas y juegos, todo gratis y en el navegador. Cada proyecto es una dimensión: entrá, subí de nivel y desbloqueá logros mientras explorás.</p>
    <div class="cta">
      <button class="btn pri" id="heroExplorar">Explorar dimensiones ▸</button>
      <button class="btn" id="heroPerfil">Mi perfil</button>
    </div>
    <div class="player" id="playerCard"></div>
  </section>

  <div id="galaxias"></div>

  <footer class="footer">
    <span>Taller Multiverse · hecho por GonzalitoDev · todo gratis, sin cuenta.</span>
    <span><a href="clasico/">Ver versión clásica</a></span>
  </footer>
</main>

<!-- drawer de paneles -->
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" aria-label="Panel">
  <div class="dhead"><h2 id="drawerTit">Panel</h2><button class="x" id="drawerX" aria-label="Cerrar">✕</button></div>
  <div class="dbody" id="drawerBody"></div>
</aside>

<div id="toasts" aria-live="polite"></div>

<script src="multiverse/data.js"></script>
<script src="multiverse/multiverse.js"></script>
<script src="asistente/widget.js" data-sitio="taller" defer></script>
</body>
</html>
