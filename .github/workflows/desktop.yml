name: Instalador de Windows

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Usar la versión del tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Armar instaladores (.exe y .msi)
        run: npm run dist

      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Taller-Windows
          path: |
            desktop/dist/*.exe
            desktop/dist/*.msi

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Taller ${{ github.ref_name }}
          body: |
            Instaladores de Taller para Windows (64 bits): Corte, Lienzo, Trazo, Folio y Onda en una sola app.
            - **Taller-Setup-*.exe**: instalador recomendado, elegís la carpeta y crea accesos directos.
            - **Taller-*-x64.msi**: para instalar en equipos administrados.
            Al ser una app sin firma digital, Windows puede mostrar "Windows protegió tu PC": tocá "Más información" y "Ejecutar de todas formas".
          files: |
            desktop/dist/*.exe
            desktop/dist/*.msi
